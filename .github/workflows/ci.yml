name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The hooks run on whatever Node the user has; the tests spawn the hook as
      # a subprocess, so this is the same code path a real session takes.
      - run: node --test test/hook.test.mjs

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      # --strict so unrecognized fields and missing metadata fail here rather
      # than at submission review.
      - run: claude plugin validate . --strict
      - run: claude plugin validate ./.claude-plugin/plugin.json --strict
